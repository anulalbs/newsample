kind: Invoke
apiVersion: api.ibm.com/v1
metadata:
  name: invoke-petstore-gateway
  namespace: project1
  version: '1.0'
  tags: []
  labels:
    gatewayTypes:
      - nano
spec:
  endpoint:
    http:
      target:
        persistentConnections: false
        timeout: 30
        url: '"https://petstore3.swagger.io/api/v3" & $relativeUrl(''request'')'
        decompressResponse: false
        followRedirects: false
        chunkedUpload: false
        urlType: jsonata
        tlsClientProfile: tls-client-profile-catalog-default:1.0.0
